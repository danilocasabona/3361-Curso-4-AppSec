repos:
- repo: local
  hooks:
    - id: trufflehog
      name: TruffleHog
      description: Detect secrets in your data.
      entry: bash -c 'docker run --rm -v "$PWD:/workdir" trufflesecurity/trufflehog:latest filesystem /workdir --no-history --json | tee result-trufflehog.txt'
      language: system
      pass_filenames: false
      stages: ["pre-commit", "pre-push"]
