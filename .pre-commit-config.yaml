repos:
- repo: local
  hooks:
    - id: trufflehog
      name: TruffleHog
      description: Detect secrets in your data.
      entry: bash -c 'echo "🔎 Executando TruffleHog..."; docker run --rm -v "$(pwd):/workdir" trufflesecurity/trufflehog:latest filesystem /workdir --json | tee result-trufflehog.txt'
      language: system
      pass_filenames: false
      always_run: true
      stages: ["pre-commit", "pre-push"]
